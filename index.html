
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- SEC-C-009: the Google Fonts <link> for Montserrat was REMOVED. Both Montserrat
       and Gobold are now self-hosted via @font-face in src/index.css, served from our
       own origin out of public/fonts/.

       Why removal rather than adding SRI: Google generates the font CSS per user-agent,
       so its bytes differ between visitors and an integrity hash cannot be pinned — the
       SRI gap was unfixable while the third-party origin remained. Self-hosting also
       stops disclosing every visitor's IP to Google on first paint, and it lets the CSP
       drop fonts.googleapis.com from style-src and fonts.gstatic.com from font-src
       (SEC-C-003 / EXT-002), removing the last third-party origin from the policy.

       SEC-C-001 (earlier, kept for history): the preconnect hints were removed because a
       preconnect is evaluated against connect-src, which never listed the font origins —
       that was the CSP violation blocking the switch from Report-Only to enforcing. With
       the stylesheet itself now gone, that whole class of violation is closed. -->
  <!-- 72 Street brand mark (yellow vertical logo) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
  <link rel="apple-touch-icon" href="/brand/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <!-- QA-C-013: the PWA meta tags (mobile-web-app-capable, apple-mobile-web-app-*)
       were removed. They advertise a standalone installable app, but there is no web
       app manifest in the project, so installation never worked — the tags promised
       a capability the build does not ship. Removing them is the honest fix; if
       installability becomes a product goal, add a real manifest (name, short_name,
       start_url, display, icons) and reinstate them together. theme-color is kept:
       it colours the mobile browser chrome and needs no manifest. -->
  <meta name="theme-color" content="#fdd405" />

  <title>VENTYAI · 72 Street</title>
  <meta name="description" content="VentyAI by 72 Street: Ask anything about Indian stocks, NIFTY, fundamentals, screener, and market trends. Wealth has a new address." />

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
  <!-- CONF-BRAND-ASSET-001: three problems fixed here.
       1. og:image was a RELATIVE path ("/brand/favicon-512.png"). Crawlers
          require an absolute URL, so link previews were showing no image at all.
       2. It pointed at a 512x512 favicon. A square icon renders as a small
          thumbnail; a landscape asset renders as a large card. Now uses the
          1214x736 brand lockup, with width/height declared so a crawler need not
          fetch the file to lay the card out.
       3. twitter:card was "summary" (small square) and there was no twitter:image
          at all — now summary_large_image with an explicit image.
       og:url is intentionally the canonical marketing origin, not the UAT host, so
       a shared link resolves to the public site rather than to aws.72street.ai. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="VentyAI — AI Stock Market Assistant by 72 Street" />
  <meta property="og:description" content="Ask anything about Indian stocks, NIFTY, fundamentals, and market trends. Wealth has a new address." />
  <meta property="og:url" content="https://72street.ai/" />
  <meta property="og:site_name" content="VentyAI" />
  <meta property="og:image" content="https://72street.ai/brand/venty-full-dark-v4.png" />
  <meta property="og:image:width" content="1214" />
  <meta property="og:image:height" content="760" />
  <meta property="og:image:alt" content="VentyAI by 72 Street — AI stock market assistant" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VentyAI — AI Stock Market Assistant by 72 Street" />
  <meta name="twitter:description" content="Ask anything about Indian stocks, NIFTY, fundamentals, and market trends. Wealth has a new address." />
  <meta name="twitter:image" content="https://72street.ai/brand/venty-full-dark-v4.png" />
</head>

<body>
  <div id="root"></div>
  <!-- Portal mount for floating popups (group-clarification chips, horizon picker) -->
  <div id="kuberai-popup-root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>

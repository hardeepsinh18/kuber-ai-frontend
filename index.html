
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Montserrat — 72 Street brand body typeface (Gobold display font self-hosted via index.css) -->
  <!-- SEC-C-001: the font-origin preconnect hints were removed deliberately. A
       preconnect is evaluated against connect-src, which does not list
       fonts.googleapis.com, and the audit's browser run recorded exactly that
       CSP violation — the one thing blocking the policy from being switched from
       Report-Only to enforcing. The stylesheet below is checked against style-src
       and the font files against font-src, both of which already allow these
       origins, so this costs a few ms of DNS warm-up and nothing visually. -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- 72 Street brand mark (yellow vertical logo) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
  <link rel="apple-touch-icon" href="/brand/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <!-- QA-C-013: the PWA meta tags (mobile-web-app-capable, apple-mobile-web-app-*)
       were removed. They advertise a standalone installable app, but there is no web
       app manifest in the project, so installation never worked — the tags promised
       a capability the build does not ship. Removing them is the honest fix; if
       installability becomes a product goal, add a real manifest (name, short_name,
       start_url, display, icons) and reinstate them together. theme-color is kept:
       it colours the mobile browser chrome and needs no manifest. -->
  <meta name="theme-color" content="#fdd405" />

  <title>Venty — AI Stock Market Assistant by 72 Street</title>
  <meta name="description" content="Venty by 72 Street: Ask anything about Indian stocks, NIFTY, fundamentals, screener, and market trends. Wealth has a new address." />

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
  <!-- CONF-BRAND-ASSET-001: three problems fixed here.
       1. og:image was a RELATIVE path ("/brand/favicon-512.png"). Crawlers
          require an absolute URL, so link previews were showing no image at all.
       2. It pointed at a 512x512 favicon. A square icon renders as a small
          thumbnail; a landscape asset renders as a large card. Now uses the
          1214x736 brand lockup, with width/height declared so a crawler need not
          fetch the file to lay the card out.
       3. twitter:card was "summary" (small square) and there was no twitter:image
          at all — now summary_large_image with an explicit image.
       og:url is intentionally the canonical marketing origin, not the UAT host, so
       a shared link resolves to the public site rather than to aws.72street.ai. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Venty — AI Stock Market Assistant by 72 Street" />
  <meta property="og:description" content="Ask anything about Indian stocks, NIFTY, fundamentals, and market trends. Wealth has a new address." />
  <meta property="og:url" content="https://72street.ai/" />
  <meta property="og:site_name" content="Venty" />
  <meta property="og:image" content="https://72street.ai/brand/venty-full-dark-v3.png" />
  <meta property="og:image:width" content="1214" />
  <meta property="og:image:height" content="736" />
  <meta property="og:image:alt" content="Venty by 72 Street — AI stock market assistant" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Venty — AI Stock Market Assistant by 72 Street" />
  <meta name="twitter:description" content="Ask anything about Indian stocks, NIFTY, fundamentals, and market trends. Wealth has a new address." />
  <meta name="twitter:image" content="https://72street.ai/brand/venty-full-dark-v3.png" />
</head>

<body>
  <div id="root"></div>
  <!-- Portal mount for floating popups (group-clarification chips, horizon picker) -->
  <div id="kuberai-popup-root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
